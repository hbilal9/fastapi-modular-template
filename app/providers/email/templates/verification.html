{% extends "base.html" %}
{% block content %}
<h1 style="font-size: 20px;">Welcome, {{ first_name }}!</h1>
<p>Confirm your email to finish setting up your {{ app_name }} account.</p>
<p><a href="{{ verify_url }}" style="display: inline-block; padding: 10px 18px; background: #111; color: #fff; text-decoration: none; border-radius: 6px;">Verify email</a></p>
<p style="font-size: 12px; color: #888;">This link expires in 24 hours.</p>
{% endblock %}
