{% extends "base.html" %}
{% block content %}
<h1 style="font-size: 20px;">Reset your password</h1>
<p>We received a request to reset your {{ app_name }} password.</p>
<p><a href="{{ reset_url }}" style="display: inline-block; padding: 10px 18px; background: #111; color: #fff; text-decoration: none; border-radius: 6px;">Reset password</a></p>
<p style="font-size: 12px; color: #888;">This link expires in 30 minutes. If you didn't request it, ignore this email.</p>
{% endblock %}
