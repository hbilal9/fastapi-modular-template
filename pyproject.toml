[project]
name = "fastapi-modular-postgres-template"
version = "0.1.0"
description = "FastAPI Modular Postgres Template"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "HBilal Khan Yousafzai", email = "hbilal.dev@gmail.com" }]

urls = { Homepage = "https://example.com/saas-backend", Issues = "https://github.com/hbilal9/fastapi-modular-template/issues", Repository = "https://github.com/hbilal9/fastapi-modular-template" }

dependencies = [
  "alembic>=1.18.4",
  "asyncpg>=0.31.0",
  "bcrypt>=4.2.1",
  "celery[redis]>=5.6.3",
  "fastapi>=0.136.3",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.14.1",
  "pydantic[email]>=2.12.3",
  "python-jose[cryptography]>=3.3.0",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.50",
  "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -------------------------
# Bandit (security)
# -------------------------
[tool.bandit]
exclude_dirs = ["tests", "migrations", "alembic"]
skips = ["B101", "B601"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -------------------------
# MyPy
# -------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

# -------------------------
# Ruff (lint + format)
# -------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
# Keep extended project-specific ignores AND a broad exclude list
extend-exclude = ["migrations", "alembic"]
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort (import sorting)
  "B",  # bugbear
  "UP",  # pyupgrade
  "SIM",  # simplify
]
ignore = [
  "E501",  # line too long (formatter handles)
  "E203",  # whitespace before ':'
  "B008",  # FastAPI Depends used in defaults
  "B904",  # raise in except without from
]
# From A → enable sweeping autofix and smarter dummy variables
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/env.py" = ["E402", "F401"]
"app/main.py" = ["E402"]
"app/services/prompting/suggestion_prompt.py" = ["F541"]
